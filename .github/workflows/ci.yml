name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and end-to-end tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Smoke test (gateway + mock N-ATLAS + Redis)
        env:
          REDIS_URL: redis://localhost:6379
          PORT: 8080
        run: |
          npm start > gateway.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/healthz | grep -q '"store":"redis"'
          GATEWAY_URL=http://127.0.0.1:8080/v1 DEMO_PAUSE_MS=0 npm run demo
          GATEWAY_URL=http://127.0.0.1:8080/v1 UPSTREAM_DIRECT_URL=http://127.0.0.1:8080/mock/v1 npm run bench
          cat bench-results.md >> "$GITHUB_STEP_SUMMARY"
